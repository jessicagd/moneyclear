<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><label for="amAnio" style="font-weight: 600">En el año</label><span style="display: flex; align-items: center; gap: 6px; flex-shrink: 0"><input type="number" inputmode="decimal" aria-label="En el año" min="1" max="160" step="any" value="{{amAnioIn}}" onChange="{{amAnioType}}" onBlur="{{amAnioBlur}}" style="width: 112px; min-height: 40px; box-sizing: border-box; padding: 6px 10px; border: 1.5px solid #F0DDD2; border-radius: 10px; font: 500 0.95rem 'IBM Plex Mono', monospace; color: #2A1A14; background: #FFFFFF; text-align: right"><span style="font-size: 0.85rem; white-space: nowrap">de hipoteca</span></span></div>
<input id="amAnio" type="range" min="1" max="40" step="1" value="{{amAnio}}" onChange="{{on_amAnio}}">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><label for="amAnual" style="font-weight: 600">Además, cada año a partir de entonces</label><span style="display: flex; align-items: center; gap: 6px; flex-shrink: 0"><input type="number" inputmode="decimal" aria-label="Además, cada año a partir de entonces" min="0" max="80000" step="any" value="{{amAnualIn}}" onChange="{{amAnualType}}" onBlur="{{amAnualBlur}}" style="width: 112px; min-height: 40px; box-sizing: border-box; padding: 6px 10px; border: 1.5px solid #F0DDD2; border-radius: 10px; font: 500 0.95rem 'IBM Plex Mono', monospace; color: #2A1A14; background: #FFFFFF; text-align: right"><span style="font-size: 0.85rem; white-space: nowrap">€</span></span></div>
<input id="amAnual" type="range" min="0" max="20000" step="250" value="{{amAnual}}" onChange="{{on_amAnual}}">
<span style="font-size: 0.85rem; color: #6B5248">Opcional: un extra fijo cada año, como una paga extra.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><label for="amCom" style="font-weight: 600">Comisión por amortizar</label><span style="display: flex; align-items: center; gap: 6px; flex-shrink: 0"><input type="number" inputmode="decimal" aria-label="Comisión por amortizar" min="0" max="8" step="any" value="{{amComIn}}" onChange="{{amComType}}" onBlur="{{amComBlur}}" style="width: 112px; min-height: 40px; box-sizing: border-box; padding: 6px 10px; border: 1.5px solid #F0DDD2; border-radius: 10px; font: 500 0.95rem 'IBM Plex Mono', monospace; color: #2A1A14; background: #FFFFFF; text-align: right"><span style="font-size: 0.85rem; white-space: nowrap">%</span></span></div>
<input id="amCom" type="range" min="0" max="2" step="0.05" value="{{amCom}}" onChange="{{on_amCom}}">
<span style="font-size: 0.85rem; color: #6B5248">Mira tu escritura. La ley pone un máximo según el tipo de hipoteca.</span>
</div>
<div style="padding: 14px 16px; background: #FFF8F3; border-radius: 12px; display: flex; justify-content: space-between; gap: 12px"><span>Adelantas en total</span><span style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap; font-weight: 600">{{amTotalTxt}}</span></div>
</div>
<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<div style="background: #FFE9DF; border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 10px; color: #6B2A18; min-width: 0">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em">Opción 1 · Reducir plazo</p>
<p style="margin: 0; font-family: 'Sora', sans-serif; font-weight: 700; font-size: clamp(1.6rem, 3vw, 2.1rem); line-height: 1.1; color: #2A1A14">{{plTitular}}</p>
<p style="margin: 0">Sigues pagando la misma cuota, pero terminas antes.</p>
<div style="display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 1px solid currentColor"><span>Intereses que te ahorras</span><span style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap; font-weight: 600">{{plAhorro}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><span>Cuota mensual</span><span style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">{{plCuota}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><span>Terminas de pagar</span><span style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">{{plFin}}</span></div>
</div>
<div style="background: #E3F0EE; border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 10px; color: #1F4F4B; min-width: 0">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em">Opción 2 · Reducir cuota</p>
<p style="margin: 0; font-family: 'Sora', sans-serif; font-weight: 700; font-size: clamp(1.6rem, 3vw, 2.1rem); line-height: 1.1; color: #2A1A14">{{cuTitular}}</p>
<p style="margin: 0">Terminas en la misma fecha, pero pagas menos cada mes.</p>
<div style="display: flex; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 1px solid currentColor"><span>Intereses que te ahorras</span><span style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap; font-weight: 600">{{cuAhorro}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><span>Cuota mensual</span><span style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">{{cuCuota}}</span></div>
<div style="display: flex; justify-content: space-between; gap: 12px"><span>Terminas de pagar</span><span style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">{{cuFin}}</span></div>
</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #F0DDD2; border-radius: 20px; padding: 26px">
<h3 style="margin: 0 0 16px; font-family: 'Sora', sans-serif; font-size: 1.25rem">Intereses que pagas en total</h3>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{amBarras}}" as="b" hint-placeholder-count="3">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px">
<span style="flex: 0 0 160px">{{b.label}}</span>
<div style="flex: 1 1 200px; height: 20px; background: #F5E6DD; border-radius: 6px; overflow: hidden"><div style="{{b.bar}}"></div></div>
<span style="flex: 0 0 100px; text-align: right; font-family: 'IBM Plex Mono', monospace; white-space: nowrap">{{b.valor}}</span>
</div>
</sc-for>
</div>
<p style="margin: 16px 0 0; font-size: 0.92rem; color: #6B5248">{{amComTxt}}</p>
</div>
</div>
</div>
<div style="margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px">
<div style="background: #FFFFFF; border: 1px solid #F0DDD2; border-radius: 18px; padding: 24px">
<h3 style="margin: 0 0 8px; font-family: 'Sora', sans-serif; font-size: 1.15rem">¿Plazo o cuota?</h3>
<p style="margin: 0; color: #6B5248">Reducir plazo ahorra más intereses. Reducir cuota te da más margen cada mes, útil si tu sueldo va justo o esperas gastos.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #F0DDD2; border-radius: 18px; padding: 24px">
<h3 style="margin: 0 0 8px; font-family: 'Sora', sans-serif; font-size: 1.15rem">Cuanto antes, mejor</h3>
<p style="margin: 0; color: #6B5248">Al principio la cuota es casi todo intereses. Amortizar en los primeros años ahorra mucho más que hacerlo al final.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #F0DDD2; border-radius: 18px; padding: 24px">
<h3 style="margin: 0 0 8px; font-family: 'Sora', sans-serif; font-size: 1.15rem">La comisión tiene tope</h3>
<p style="margin: 0; color: #6B5248">Por ley: en tipo fijo, como mucho un 2 % los 10 primeros años y un 1,5 % después. En variable, un 0,25 % los 3 primeros años o un 0,15 % los 5 primeros (según contrato) y luego nada.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #F0DDD2; border-radius: 18px; padding: 24px">
<h3 style="margin: 0 0 8px; font-family: 'Sora', sans-serif; font-size: 1.15rem">No te quedes sin colchón</h3>
<p style="margin: 0; color: #6B5248">El dinero que metes en la hipoteca ya no lo puedes recuperar. Amortiza solo después de tener tu fondo de emergencia.</p>
</div>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 16px 24px 56px">
<p style="margin: 0 0 12px; font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: #2F6F6A">Paso a paso</p>
<h2 style="margin: 0 0 8px; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 2.4rem; letter-spacing: -0.02em">Cómo se pide una hipoteca, de principio a fin</h2>
<p style="margin: 0 0 32px; color: #6B5248; max-width: 760px">Desde que empiezas a hacer números hasta que tienes las llaves suelen pasar entre uno y tres meses. Este es el orden habitual.</p>
<div style="background: #FFFFFF; border: 1px solid #F0DDD2; border-radius: 24px; padding: 36px 32px 8px">
<div style="display: flex; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0">
<span style="width: 44px; height: 44px; border-radius: 999px; background: #C9452A; color: #FFF8F3; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700">1</span>
<span style="flex: 1; width: 2px; background: #F0DDD2; margin: 6px 0"></span>
</div>
<div style="padding-bottom: 28px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0 6px">
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Haz números antes de buscar casa</h3>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; background: #FFE9DF; color: #6B2A18; padding: 4px 10px; border-radius: 999px">Tú</span>
</div>
<p style="margin: 0; color: #6B5248; max-width: 720px">Calcula con el simulador cuánto puedes pedir. La referencia habitual: tener ahorrado en torno a un 30 % del precio (20 % de entrada más un 10 % de gastos) y que la cuota no pase del 30–35 % de tus ingresos.</p>
</div>
</div>
<div style="display: flex; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0">
<span style="width: 44px; height: 44px; border-radius: 999px; background: #2A1A14; color: #FFF8F3; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700">2</span>
<span style="flex: 1; width: 2px; background: #F0DDD2; margin: 6px 0"></span>
</div>
<div style="padding-bottom: 28px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0 6px">
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Pide estudios a varios bancos</h3>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; background: #FFE9DF; color: #6B2A18; padding: 4px 10px; border-radius: 999px">Gratis</span>
</div>
<p style="margin: 0; color: #6B5248; max-width: 720px">Lleva tu documentación a 2–4 bancos o a un intermediario hipotecario y pide una precalificación: cuánto te prestarían y en qué condiciones aproximadas.</p>
</div>
</div>
<div style="display: flex; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0">
<span style="width: 44px; height: 44px; border-radius: 999px; background: #2A1A14; color: #FFF8F3; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700">3</span>
<span style="flex: 1; width: 2px; background: #F0DDD2; margin: 6px 0"></span>
</div>
<div style="padding-bottom: 28px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0 6px">
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Encuentra la vivienda y revísala</h3>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; background: #FFE9DF; color: #6B2A18; padding: 4px 10px; border-radius: 999px">Nota simple: unos 10 €</span>
</div>
<p style="margin: 0; color: #6B5248; max-width: 720px">Pide la nota simple del Registro para comprobar quién es el dueño y si tiene cargas, como embargos o hipotecas. Pregunta también si hay deudas con la comunidad o de IBI.</p>
</div>
</div>
<div style="display: flex; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0">
<span style="width: 44px; height: 44px; border-radius: 999px; background: #2A1A14; color: #FFF8F3; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700">4</span>
<span style="flex: 1; width: 2px; background: #F0DDD2; margin: 6px 0"></span>
</div>
<div style="padding-bottom: 28px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0 6px">
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Firma las arras</h3>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; background: #FFE9DF; color: #6B2A18; padding: 4px 10px; border-radius: 999px">Señal ≈ 10 %</span>
</div>
<p style="margin: 0; color: #6B5248; max-width: 720px">Es el contrato de reserva: entregas una señal, habitualmente el 10 % del precio, y fijas una fecha para firmar. Deja margen para conseguir la hipoteca: si te echas atrás, normalmente pierdes la señal.</p>
</div>
</div>
<div style="display: flex; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0">
<span style="width: 44px; height: 44px; border-radius: 999px; background: #2A1A14; color: #FFF8F3; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700">5</span>
<span style="flex: 1; width: 2px; background: #F0DDD2; margin: 6px 0"></span>
</div>
<div style="padding-bottom: 28px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0 6px">
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Tasación</h3>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; background: #FFE9DF; color: #6B2A18; padding: 4px 10px; border-radius: 999px">La pagas tú</span>
</div>
<p style="margin: 0; color: #6B5248; max-width: 720px">El banco encarga tasar la vivienda. Te prestará un porcentaje del valor más bajo entre la tasación y el precio de compra, así que una tasación baja te obliga a poner más ahorros.</p>
</div>
</div>
<div style="display: flex; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0">
<span style="width: 44px; height: 44px; border-radius: 999px; background: #2A1A14; color: #FFF8F3; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700">6</span>
<span style="flex: 1; width: 2px; background: #F0DDD2; margin: 6px 0"></span>
</div>
<div style="padding-bottom: 28px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0 6px">
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Oferta vinculante: la FEIN</h3>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; background: #FFE9DF; color: #6B2A18; padding: 4px 10px; border-radius: 999px">Mínimo 10 días</span>
</div>
<p style="margin: 0; color: #6B5248; max-width: 720px">Cuando el banco aprueba la operación te entrega la FEIN y la FiAE con todas las condiciones. Desde ese momento tienen que pasar al menos 10 días antes de firmar. Compárala con otras ofertas.</p>
</div>
</div>
<div style="display: flex; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0">
<span style="width: 44px; height: 44px; border-radius: 999px; background: #2A1A14; color: #FFF8F3; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700">7</span>
<span style="flex: 1; width: 2px; background: #F0DDD2; margin: 6px 0"></span>
</div>
<div style="padding-bottom: 28px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0 6px">
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Visita al notario</h3>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; background: #FFE9DF; color: #6B2A18; padding: 4px 10px; border-radius: 999px">Gratis</span>
</div>
<p style="margin: 0; color: #6B5248; max-width: 720px">Antes de la firma vas al notario que tú elijas. Comprueba que entiendes la hipoteca y lo deja por escrito en un acta. Es el momento de preguntar todo.</p>
</div>
</div>
<div style="display: flex; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0">
<span style="width: 44px; height: 44px; border-radius: 999px; background: #C9452A; color: #FFF8F3; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700">8</span>
<span style="flex: 1; width: 2px; background: #F0DDD2; margin: 6px 0"></span>
</div>
<div style="padding-bottom: 28px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0 6px">
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Firma y llaves</h3>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; background: #FFE9DF; color: #6B2A18; padding: 4px 10px; border-radius: 999px">El gran día</span>
</div>
<p style="margin: 0; color: #6B5248; max-width: 720px">La compraventa y la hipoteca se firman el mismo día ante notario. El banco paga al vendedor la parte financiada, tú pagas el resto y te dan las llaves.</p>
</div>
</div>
<div style="display: flex; gap: 20px">
<div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0">
<span style="width: 44px; height: 44px; border-radius: 999px; background: #2A1A14; color: #FFF8F3; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700">9</span>

</div>
<div style="padding-bottom: 28px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0 6px">
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Después de firmar</h3>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; background: #FFE9DF; color: #6B2A18; padding: 4px 10px; border-radius: 999px">Primer mes</span>
</div>
<p style="margin: 0; color: #6B5248; max-width: 720px">Se paga el impuesto de la compra en tu comunidad (normalmente en un mes) y se inscribe la vivienda en el Registro. Pon los suministros a tu nombre, empadrónate y avisa al ayuntamiento para el IBI.</p>
</div>
</div>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 0 24px 56px">
<h2 style="margin: 0 0 8px; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 2.2rem; letter-spacing: -0.02em">¿Quién paga qué?</h2>
<p style="margin: 0 0 24px; color: #6B5248; max-width: 760px">Desde 2019 la ley reparte los gastos: los de la hipoteca los paga el banco y los de la compra los pagas tú.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px">
<div style="background: #FFE9DF; border-radius: 20px; padding: 28px">
<h3 style="margin: 0 0 14px; font-family: 'Sora', sans-serif; font-size: 1.3rem">Lo pagas tú</h3>
<div style="display: flex; flex-direction: column; gap: 10px; color: #6B2A18">
<p style="margin: 0"><strong>El impuesto de la compra:</strong> ITP si es de segunda mano.</p>
<p style="margin: 0"><strong>Notaría y Registro</strong> de la escritura de compraventa.</p>
<p style="margin: 0"><strong>Gestoría</strong> de la compraventa, si la contratas.</p>
<p style="margin: 0"><strong>La tasación.</strong></p>
<p style="margin: 0"><strong>Las copias</strong> de la escritura de hipoteca que tú pidas.</p>
</div>
</div>
<div style="background: #E3F0EE; border-radius: 20px; padding: 28px">
<h3 style="margin: 0 0 14px; font-family: 'Sora', sans-serif; font-size: 1.3rem">Lo paga el banco</h3>
<div style="display: flex; flex-direction: column; gap: 10px; color: #1F4F4B">
<p style="margin: 0"><strong>Notaría</strong> de la escritura de hipoteca.</p>
<p style="margin: 0"><strong>Registro</strong> de la hipoteca.</p>
<p style="margin: 0"><strong>Gestoría</strong> de la hipoteca.</p>
<p style="margin: 0"><strong>El impuesto de la hipoteca</strong> (Actos Jurídicos Documentados).</p>
</div>
</div>
</div>
<p style="margin: 20px 0 0; padding: 18px 22px; background: #FFFFFF; border: 1px solid #F0DDD2; border-radius: 16px"><strong>¿Obra nueva?</strong> No pagas ITP: pagas un 10 % de IVA al promotor y, además, el Impuesto de Actos Jurídicos Documentados de la compraventa, con un porcentaje que fija cada comunidad.</p>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 0 24px 56px">
<div style="background: #2A1A14; color: #FFF8F3; border-radius: 24px; padding: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px">

</div>
<p style="margin: 14px 0 0; color: #6B5248">Aunque no estés obligado, si te sale a devolver, declara: si no, ese dinero no vuelve.</p>

<div style="flex: 1 1 440px; min-width: 0; background: #FFFFFF; border: 1px solid #F0DDD2; border-radius: 20px; padding: 28px">

<div style="display: flex; flex-direction: column; gap: 12px; color: #6B5248">
<p style="margin: 0"><strong style="color: #2A1A14">Dos pagadores.</strong> Cada empresa te retiene como si fuera tu único sueldo, así que entre las dos se quedan cortas.</p>
<p style="margin: 0"><strong style="color: #2A1A14">Una subida a mitad de año</strong> que no se trasladó bien a la retención.</p>

<section id="pasos" style="max-width: 1200px; margin: 0 auto; padding: 0 24px 56px">

<span style="font-family: 'IBM Plex Mono', monospace; color: #2F6F6A">01</span>
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Entra en Renta WEB</h3>
<p style="margin: 0; color: #6B5248">En la web de la Agencia Tributaria, con Cl@ve, certificado digital o número de referencia. La campaña suele ir de abril a finales de junio.</p>

<div style="display: flex; flex-direction: column; gap: 8px; border-top: 2px solid #2A1A14; padding-top: 18px">

<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.25rem">Revisa el borrador</h3>
<p style="margin: 0; color: #6B5248">Hacienda ya tiene tus datos fiscales, pero no lo sabe todo: alquiler, donativos o deducciones de tu comunidad las añades tú.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; border-top: 2px solid #2A1A14; padding-top: 18px">
<span style="font-family: 'IBM Plex Mono', monospace; color: #2F6F6A">03</span>
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Individual o conjunta</h3>
<p style="margin: 0; color: #6B5248">Si estás casado o tienes hijos, compara las dos opciones. El programa te enseña cuál sale mejor.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; border-top: 2px solid #2A1A14; padding-top: 18px">
<span style="font-family: 'IBM Plex Mono', monospace; color: #2F6F6A">04</span>
<h3 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 1.25rem">Presenta</h3>
<p style="margin: 0; color: #6B5248">Si sale a pagar, puedes fraccionarlo sin intereses: un 60 % al presentar y el 40 % restante en noviembre.</p>
</div>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 0 24px 56px">
<div style="background: #E3F0EE; border-radius: 24px; padding: 40px">

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 32px; color: #24423F">
<p style="margin: 0"><strong>Plan de pensiones.</strong> Lo que aportas (hasta 1.500 € al año) reduce tu base y, por tanto, lo que pagas.</p>
<p style="margin: 0"><strong>Donativos.</strong> A ONG acogidas a la ley de mecenazgo: recuperas el 80 % de los primeros 250 €.</p>
<p style="margin: 0"><strong>Deducciones autonómicas.</strong> Cada comunidad tiene las suyas: alquiler de jóvenes, nacimientos, gastos escolares… Revísalas.</p>
<p style="margin: 0"><strong>Cuotas sindicales y colegiales.</strong> Si son obligatorias para tu trabajo, se pueden restar.</p>

<section id="autonomos" style="background: #2A1A14; color: #FFF8F3">
<div style="max-width: 1200px; margin: 0 auto; padding: 80px 24px">
<p style="margin: 0 0 12px; font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: #F4876B">Si trabajas por tu cuenta</p>
<h2 style="margin: 0 0 16px; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 2.6rem; line-height: 1.08; letter-spacing: -0.02em; max-width: 760px">Como autónomo, tú eres tu propio departamento de nóminas</h2>
<p style="margin: 0 0 40px; color: #E8D5CB; font-size: 1.1rem; max-width: 760px">Nadie te retiene nada por defecto: vas adelantando impuestos cada trimestre y en la Renta haces el ajuste final, igual que un asalariado.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px">
<div style="border: 1px solid #5A4036; border-radius: 18px; padding: 24px">
<h3 style="margin: 0 0 8px; font-family: 'Sora', sans-serif; font-size: 1.25rem">Retención en tus facturas</h3>
<p style="margin: 0; color: #E8D5CB">Si facturas a empresas como profesional, aplicas un 15 % de retención (7 % el año en que empiezas y los dos siguientes).</p>
</div>
<div style="border: 1px solid #5A4036; border-radius: 18px; padding: 24px">
<h3 style="margin: 0 0 8px; font-family: 'Sora', sans-serif; font-size: 1.25rem">Modelo 130</h3>
<p style="margin: 0; color: #E8D5CB">Pago a cuenta trimestral del 20 % de tu beneficio. No hace falta si al menos el 70 % de lo que facturas ya lleva retención.</p>
</div>
<div style="border: 1px solid #5A4036; border-radius: 18px; padding: 24px">
<h3 style="margin: 0 0 8px; font-family: 'Sora', sans-serif; font-size: 1.25rem">Modelo 303 (IVA)</h3>
<p style="margin: 0; color: #E8D5CB">El IVA que cobras no es tuyo: lo ingresas cada trimestre, restando el IVA de tus gastos de la actividad.</p>
</div>
<div style="border: 1px solid #5A4036; border-radius: 18px; padding: 24px">
<h3 style="margin: 0 0 8px; font-family: 'Sora', sans-serif; font-size: 1.25rem">Cuota de autónomos</h3>
<p style="margin: 0; color: #E8D5CB">Se paga cada mes a la Seguridad Social y depende de tus rendimientos netos reales. Es gasto deducible.</p>
</div>
</div>
<h3 style="margin: 0 0 16px; font-family: 'Sora', sans-serif; font-size: 1.4rem">Tu calendario fiscal</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px">
<div style="background: #3A271F; border-radius: 14px; padding: 18px"><p style="margin: 0; font-family: 'IBM Plex Mono', monospace; color: #F4876B">1–20 abril</p><p style="margin: 4px 0 0; color: #E8D5CB">1.er trimestre</p></div>
<div style="background: #3A271F; border-radius: 14px; padding: 18px"><p style="margin: 0; font-family: 'IBM Plex Mono', monospace; color: #F4876B">1–20 julio</p><p style="margin: 4px 0 0; color: #E8D5CB">2.º trimestre</p></div>
<div style="background: #3A271F; border-radius: 14px; padding: 18px"><p style="margin: 0; font-family: 'IBM Plex Mono', monospace; color: #F4876B">1–20 octubre</p><p style="margin: 4px 0 0; color: #E8D5CB">3.er trimestre</p></div>
<div style="background: #3A271F; border-radius: 14px; padding: 18px"><p style="margin: 0; font-family: 'IBM Plex Mono', monospace; color: #F4876B">1–30 enero</p><p style="margin: 4px 0 0; color: #E8D5CB">4.º trimestre y resúmenes anuales</p></div>
<div style="background: #7FC4BC; color: #2A1A14; border-radius: 14px; padding: 18px"><p style="margin: 0; font-family: 'IBM Plex Mono', monospace">Abril–junio</p><p style="margin: 4px 0 0">Declaración de la Renta</p></div>
</div>
<p style="margin: 28px 0 0; color: #E8D5CB; max-width: 760px">Consejo práctico: aparta cada mes una parte de lo que cobras en una cuenta solo para impuestos. Así los trimestres y la Renta no te pillan sin liquidez.</p>
<a href="#p=autonomo" style="display: inline-block; margin-top: 24px; background: #F4876B; color: #2A1A14; text-decoration: none; padding: 14px 24px; border-radius: 999px; font-weight: 600">¿Te compensa? Compara autónomo y asalariado</a>

toggle: function () { var n = Object.assign({}, self.state.hechos); n[id] = !n[id]; self.setState({ hechos: n }); }

};
var total = antes.length + alta.length;
var hechos = Object.keys(h).filter(function (k) { return h[k]; }).length;
return {

alta: mk(alta, 'b'),

}
};

<script>
(function () {
  var pages = window.__PAGES;
  var root = document.getElementById('app');
  var current = null, inst = null, handlers = {}, hid = 0, pending = false;
  var HOLE = /\{\{([^}]*)\}\}/g, WHOLE = /^\s*\{\{([^}]*)\}\}\s*$/;

  function lookup(path, scopes) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var segs = path.split('.'), v, found = false;
    for (var i = scopes.length - 1; i >= 0; i--) {
      if (scopes[i] && Object.prototype.hasOwnProperty.call(scopes[i], segs[0])) { v = scopes[i][segs[0]]; found = true; break; }
    }
    if (!found) return undefined;
    for (var j = 1; j < segs.length; j++) { if (v == null) return undefined; v = v[segs[j]]; }
    return v;
  }
  function str(v) { return v == null ? '' : String(v); }

  function kids(node, scopes, out) {

    }

      m = WHOLE.exec(node.getAttribute('value') || '');

        continue;
      }

        continue;
      }

    var sub = []; kids(node, scopes, sub);
    for (var k = 0; k < sub.length; k++) el.appendChild(sub[k]);
    out.push(el);
  }

  function render() {
    pending = false;
    if (!inst) return;
    handlers = {}; hid = 0;
    var vals = inst.renderVals ? inst.renderVals() : {};
    var out = []; kids(current.tpl, [vals], out);
    var wrap = document.createElement('div'); wrap.id = 'app';
    for (var i = 0; i < out.length; i++) wrap.appendChild(out[i]);
    morphdom(root, wrap);
  }
  function schedule() { if (!pending) { pending = true; Promise.resolve().then(render); } }

  window.DCLogic = class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(u) { var n = typeof u === 'function' ? u(this.state, this.props) : u; this.state = Object.assign({}, this.state, n); schedule(); }
    forceUpdate() { schedule(); }
  };
  for (var key in window.__PAGE_FACTORIES) pages[key].Comp = window.__PAGE_FACTORIES[key]();

  function isCheck(t) { return t && t.tagName === 'INPUT' && (t.type === 'checkbox' || t.type === 'radio'); }
  function fire(e, type, closest) {
    var t = e.target; if (!t || !t.getAttribute) return;
    var attr = 'data-on-' + type;
    var el = closest ? t.closest('[' + attr + ']') : (t.hasAttribute(attr) ? t : null);
    if (!el || !root.contains(el)) return;

  root.addEventListener('click', function (e) { fire(e, 'click', true); });
  root.addEventListener('input', function (e) { if (!isCheck(e.target)) fire(e, 'change', false); });
  root.addEventListener('change', function (e) { if (isCheck(e.target)) fire(e, 'change', false); });
  root.addEventListener('focusout', function (e) { fire(e, 'blur', false); });

  function go() {
    var h = location.hash, key = h.indexOf('#p=') === 0 ? h.slice(3) : null;
    if (!key && current) { var t = h.length > 1 && document.getElementById(decodeURIComponent(h.slice(1))); if (t) t.scrollIntoView(); return; }
    if (!key || !pages[key]) key = 'main';
    if (current && current.key === key) return;
    current = { key: key, tpl: document.getElementById('tpl-' + key) };
    inst = new pages[key].Comp({});
    document.title = pages[key].title;
    root.innerHTML = '';
    render();
    window.scrollTo(0, 0);
    if (h && h.indexOf('#p=') !== 0) { var el = document.getElementById(decodeURIComponent(h.slice(1))); if (el) el.scrollIntoView(); }
  }
  window.addEventListener('hashchange', go);
  go();
})();

</script>
